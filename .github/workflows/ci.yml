name: CI

# Cổng kiểm tra tự động (thêm 20/08/2026) — build thử + chạy bộ test có sẵn
# (161 test, gồm cả test kiểm chứng các bug đã sửa như lệch số Luồng duyệt)
# ngay trên GitHub trước khi merge, không cần chờ ai nhớ chạy tay. Không cần
# secret nào: đã kiểm chứng build sạch dù thiếu hết biến môi trường.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
